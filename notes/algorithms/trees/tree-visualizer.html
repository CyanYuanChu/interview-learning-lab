<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hot 100 二叉树交互图解</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: light-dark(#3f4248, #e7e9ed);
        --muted: light-dark(#7a7f88, #aeb4bf);
        --line: light-dark(#e5e7eb, #363b45);
        --soft: light-dark(rgb(0 0 0 / 2.5%), rgb(255 255 255 / 4%));
        --blue: light-dark(#55799f, #8fb4dd);
        --green: light-dark(#4f8a70, #8bc5a7);
        --orange: light-dark(#b27c3d, #ddb27a);
        --red: light-dark(#b35d65, #e49aa0);
        --blue-soft: light-dark(#eaf1ff, #203253);
        --green-soft: light-dark(#e9fbf3, #18362d);
        --orange-soft: light-dark(#fff2df, #46301b);
        --red-soft: light-dark(#ffebed, #44262a);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      }

      * { box-sizing: border-box; }
      html { background: transparent; }
      body { margin: 0; padding: 8px 3px 18px; color: var(--ink); background: transparent; }

      button {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--ink);
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--blue); background: var(--soft); }
      button:disabled { cursor: not-allowed; opacity: .42; }
      button:focus-visible { outline: 3px solid #ffc14d; outline-offset: 2px; }

      .demo { width: min(980px, 100%); margin: 0 auto; }
      .header { padding: 2px 0 12px; border-bottom: 1px solid var(--line); }
      .eyebrow { color: var(--blue); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: .08em; }
      h1 { margin: 7px 0 6px; font-size: clamp(20px, 3vw, 27px); font-weight: 700; letter-spacing: -.035em; }
      .subtitle { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }

      .toolbar { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); }
      .toolbar .primary { border-color: var(--blue); background: var(--blue); color: #fff; }
      .toolbar .danger { border-color: #f1b8bd; color: var(--red); }
      .progress { flex: 1; min-width: 100px; height: 5px; overflow: hidden; border-radius: 99px; background: var(--soft); }
      .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .28s ease; }
      .step-label { min-width: 76px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; text-align: right; }

      .event { display: grid; grid-template-columns: auto 1fr; gap: 11px; align-items: center; margin-top: 13px; padding: 10px 12px; border-left: 3px solid var(--blue); background: var(--soft); }
      .event-kicker { color: var(--blue); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
      .event-text { margin-top: 3px; font-size: 14px; font-weight: 750; line-height: 1.5; }
      .event-detail { margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.5; }

      .grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap: 22px; margin-top: 16px; }
      .panel { min-width: 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
      .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
      .panel-title { font-size: 12px; font-weight: 800; }
      .panel-note { color: var(--muted); font-size: 10px; }

      .tree-wrap { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
      .tree-svg { display: block; width: 100%; height: auto; min-height: 270px; }
      .edge { stroke: light-dark(#9cacbf, #687890); stroke-width: 1.8; fill: none; transition: all .24s ease; }
      .edge.left { stroke: var(--blue); }
      .edge.right { stroke: var(--green); }
      .edge.active { stroke-width: 3; }
      .node circle { stroke: var(--line); stroke-width: 1.7; fill: light-dark(transparent, #1b1e24); transition: all .24s ease; }
      .node text { fill: var(--ink); font-size: 14px; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
      .node.current circle { stroke: var(--blue); stroke-width: 3; fill: var(--blue-soft); }
      .node.done circle { stroke: var(--green); fill: var(--green-soft); }
      .node.target circle { stroke: var(--orange); stroke-width: 2.8; fill: var(--orange-soft); }
      .node.warning circle { stroke: var(--red); stroke-width: 3; fill: var(--red-soft); }
      .node.answer circle { stroke: var(--orange); stroke-width: 3; fill: var(--orange-soft); }
      .node-badge { fill: var(--muted); font-size: 9px; font-weight: 700; text-anchor: middle; }
      .edge-label { fill: var(--muted); font-size: 9px; font-weight: 700; }

      .legend { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 9px; color: var(--muted); font-size: 10px; }
      .legend-item { display: inline-flex; align-items: center; gap: 5px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
      .dot.done { background: var(--green); }
      .dot.target { background: var(--orange); }
      .dot.warning { background: var(--red); }

      .state-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      .state-item { min-width: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
      .state-name { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
      .state-value { overflow: hidden; margin-top: 4px; color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .state-value.orange { color: var(--orange); }
      .state-value.green { color: var(--green); }
      .state-value.red { color: var(--red); }
      .stack { display: flex; flex-wrap: wrap; gap: 6px; min-height: 31px; margin-top: 10px; }
      .chip { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--blue); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; }
      .chip.active { border-color: var(--blue); background: var(--blue-soft); }
      .chip.done { border-color: var(--green); color: var(--green); }
      .chip.warn { border-color: var(--red); color: var(--red); }
      .empty { color: var(--muted); font-size: 11px; }

      .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; min-height: 42px; margin-top: 12px; padding: 7px 9px; border: 1px dashed var(--line); border-radius: 7px; }
      .strip-label { color: var(--muted); font-size: 10px; }
      .strip-value { color: var(--green); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 800; }
      .token-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .token { display: inline-grid; min-width: 34px; height: 32px; place-items: center; padding: 0 7px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 800; transition: all .2s ease; }
      .token.current { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
      .token.range { border-color: var(--green); background: var(--green-soft); }
      .token.mid { border-color: var(--orange); background: var(--orange-soft); color: var(--orange); }
      .token.used { opacity: .36; }
      .token.bad { border-color: var(--red); background: var(--red-soft); color: var(--red); }

      .queue { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 7px; }
      .queue .chip { border-color: var(--blue); }
      .formula { margin-top: 11px; padding: 9px 10px; border-left: 2px solid var(--orange); background: var(--soft); color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.6; }
      .formula strong { color: var(--orange); }
      .map { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .map .chip { color: var(--orange); }
      .path { overflow-x: auto; white-space: nowrap; color: var(--blue); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }

      .code-panel { margin-top: 16px; }
      .code { overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.72; }
      .code-line { display: grid; grid-template-columns: 32px 1fr; min-height: 20px; padding-right: 10px; }
      .code-line.active { background: var(--blue-soft); }
      .line-no { padding-right: 8px; color: var(--muted); text-align: right; user-select: none; }
      .code-line.active .line-no { color: var(--blue); font-weight: 800; }
      .code-text { white-space: pre; }
      .kw { color: light-dark(#9257b5, #db9bf1); }
      .var-token { color: light-dark(#126d9c, #7fd8ff); }

      .explain { margin-top: 16px; padding: 12px 0 0; border-top: 1px solid var(--line); }
      .explain-title { margin: 0 0 8px; font-size: 12px; }
      .explain-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
      .explain-item { padding: 8px 8px 8px 9px; border-left: 2px solid var(--line); background: transparent; }
      .explain-item strong { display: block; color: var(--blue); font-size: 11px; }
      .explain-item span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.45; }

      @media (max-width: 780px) {
        body { padding: 10px; }
        .grid { grid-template-columns: 1fr; }
        .toolbar { flex-wrap: wrap; }
        .progress { order: 5; flex-basis: 100%; }
        .step-label { margin-left: auto; }
        .explain-grid { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <section class="header">
        <div id="eyebrow" class="eyebrow"></div>
        <h1 id="title"></h1>
        <p id="subtitle" class="subtitle"></p>
      </section>

      <section class="toolbar" aria-label="动画控制">
        <button id="prev" type="button">← 上一步</button>
        <button id="next" class="primary" type="button">下一步 →</button>
        <button id="play" type="button">▶ 自动播放</button>
        <button id="reset" class="danger" type="button">↺ 重置</button>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        <div id="stepLabel" class="step-label">1 / 1</div>
      </section>

      <section class="event" aria-live="polite">
        <div class="event-kicker">CURRENT STEP</div>
        <div>
          <div id="eventText" class="event-text"></div>
          <div id="eventDetail" class="event-detail"></div>
        </div>
      </section>

      <section class="grid">
        <div class="panel">
          <div class="panel-head"><div id="sceneTitle" class="panel-title">算法状态</div><div id="sceneNote" class="panel-note"></div></div>
          <div id="scene"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">当前状态</div><div class="panel-note">随着下一步同步更新</div></div>
          <div id="statePanel"></div>
        </div>
      </section>

      <section class="panel code-panel">
        <div class="panel-head"><div class="panel-title">代码执行位置</div><div class="panel-note">高亮行就是当前步骤</div></div>
        <div id="code" class="code"></div>
      </section>

      <section class="explain">
        <h2 class="explain-title">这道题的记忆抓手</h2>
        <div id="concepts" class="explain-grid"></div>
      </section>
    </main>

    <script>
      function cloneTree(tree) {
        return Object.fromEntries(Object.entries(tree).map(([id, node]) => [id, { ...node }]));
      }

      function treeOf(definitions) {
        const nodes = {};
        const tree = {};
        definitions.forEach(([id, value, left = null, right = null]) => {
          nodes[id] = { value };
          tree[id] = { left, right };
        });
        return { nodes, tree };
      }

      function makeSnapshot(tree, text, detail, line, extra = {}) {
        return {
          tree: cloneTree(tree),
          text,
          detail,
          line,
          current: null,
          visited: [],
          highlightIds: [],
          targetIds: [],
          warningIds: [],
          answerIds: [],
          labels: {},
          stack: [],
          ...extra,
        };
      }

      function pushStep(steps, tree, text, detail, line, extra = {}) {
        steps.push(makeSnapshot(tree, text, detail, line, extra));
      }

      function sceneWrap(svg, extra = '') {
        return `<div class="tree-wrap">${svg}</div>${extra}`;
      }

      function chipList(items, className = '') {
        if (!items || !items.length) return '<span class="empty">暂无</span>';
        return items.map((item, i) => `<span class="chip${className ? ` ${className}` : ''}${i === items.length - 1 ? ' active' : ''}">${item}</span>`).join('');
      }

      function val(cfg, id) {
        return id == null ? '—' : String(cfg.nodes[id]?.value ?? id);
      }

      function renderTree(cfg, state) {
        const ids = Object.keys(state.tree);
        const positions = cfg.positions;
        const viewBox = cfg.viewBox || '0 0 520 300';
        const active = new Set([...(state.highlightIds || []), state.current].filter(Boolean));
        const visited = new Set(state.visited || []);
        const targets = new Set(state.targetIds || []);
        const warnings = new Set(state.warningIds || []);
        const answers = new Set(state.answerIds || []);
        let html = `<svg class="tree-svg" viewBox="${viewBox}" role="img" aria-label="二叉树算法动画">`;

        ids.forEach((id) => {
          const node = state.tree[id];
          for (const [side, target] of [['left', node.left], ['right', node.right]]) {
            if (!target || !state.tree[target] || !positions[id] || !positions[target]) continue;
            const [x, y] = positions[id];
            const [tx, ty] = positions[target];
            html += `<line class="edge ${side}${active.has(id) || active.has(target) ? ' active' : ''}" x1="${x}" y1="${y + 22}" x2="${tx}" y2="${ty - 22}"></line>`;
            html += `<text class="edge-label" x="${(x + tx) / 2 + (side === 'left' ? -6 : 6)}" y="${(y + ty) / 2}">${side === 'left' ? 'L' : 'R'}</text>`;
          }
        });

        ids.forEach((id) => {
          if (!positions[id]) return;
          const [x, y] = positions[id];
          let kind = 'node';
          if (warnings.has(id)) kind += ' warning';
          else if (answers.has(id)) kind += ' answer';
          else if (active.has(id)) kind += ' current';
          else if (targets.has(id)) kind += ' target';
          else if (visited.has(id)) kind += ' done';
          html += `<g class="${kind}"><circle cx="${x}" cy="${y}" r="22"></circle><text x="${x}" y="${y}">${val(cfg, id)}</text>`;
          if (state.labels && state.labels[id] != null) html += `<text class="node-badge" x="${x}" y="${y + 36}">${state.labels[id]}</text>`;
          html += '</g>';
        });

        if (!ids.length) html += `<text class="edge-label" x="260" y="145" text-anchor="middle">还没有创建节点</text>`;
        html += '</svg>';
        return html;
      }

      function renderCode(codeLines, activeLine) {
        return codeLines.map((html, i) => `<div class="code-line${i + 1 === activeLine ? ' active' : ''}"><span class="line-no">${i + 1}</span><span class="code-text">${html || '&nbsp;'}</span></div>`).join('');
      }

      function item(name, value, tone = '') {
        return `<div class="state-item"><div class="state-name">${name}</div><div class="state-value${tone ? ` ${tone}` : ''}">${value}</div></div>`;
      }

      function stackHtml(stack) {
        if (!stack || !stack.length) return '<span class="empty">调用栈已清空</span>';
        return stack.map((item, i) => `<span class="chip${i === stack.length - 1 ? ' active' : ''}">${item}</span>`).join('');
      }

      function tokenRow(values, classFn = () => '') {
        return `<div class="token-row">${values.map((value, i) => `<span class="token ${classFn(i, value)}">${value}</span>`).join('')}</div>`;
      }

      function treeScene(cfg, state, extra = '', note = '蓝色 = 当前节点 · 绿色 = 已处理 · 橙色 = 目标') {
        return sceneWrap(renderTree(cfg, state), extra) + `<div class="legend"><span class="legend-item"><i class="dot"></i>当前节点</span><span class="legend-item"><i class="dot done"></i>已处理</span><span class="legend-item"><i class="dot target"></i>目标或关键节点</span><span class="legend-item"><i class="dot warning"></i>错误位置</span></div>`;
      }

      function standardTree(definitions, positions, viewBox = '0 0 520 300') {
        const built = treeOf(definitions);
        return { ...built, positions, viewBox };
      }

      const layouts = {
        small: standardTree([
          ['a', 1, 'b', 'c'], ['b', 2, 'd', 'e'], ['c', 3, 'f', 'g'],
          ['d', 4], ['e', 5], ['f', 6], ['g', 7],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [72, 225], e: [198, 225], f: [322, 225], g: [448, 225] }),
        height: standardTree([
          ['a', 3, 'b', 'c'], ['b', 9], ['c', 20, 'd', 'e'], ['d', 15], ['e', 7],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [322, 225], e: [448, 225] }),
        invert: standardTree([
          ['a', 4, 'b', 'c'], ['b', 2, 'd', 'e'], ['c', 7, 'f', 'g'],
          ['d', 1], ['e', 3], ['f', 6], ['g', 9],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [72, 225], e: [198, 225], f: [322, 225], g: [448, 225] }),
        symmetric: standardTree([
          ['a', 1, 'b', 'c'], ['b', 2, 'd', 'e'], ['c', 2, 'f', 'g'],
          ['d', 3], ['e', 4], ['f', 4], ['g', 3],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [72, 225], e: [198, 225], f: [322, 225], g: [448, 225] }),
        diameter: standardTree([
          ['a', 1, 'b', 'c'], ['b', 2, 'd', 'e'], ['c', 3], ['d', 4], ['e', 5],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [72, 225], e: [198, 225] }),
        level: standardTree([
          ['a', 3, 'b', 'c'], ['b', 9], ['c', 20, 'd', 'e'], ['d', 15], ['e', 7],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [322, 225], e: [448, 225] }),
        invalidBst: standardTree([
          ['a', 5, 'b', 'c'], ['b', 1], ['c', 4, 'd', 'e'], ['d', 3], ['e', 6],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [322, 225], e: [448, 225] }),
        kth: standardTree([
          ['a', 5, 'b', 'c'], ['b', 3, 'd', 'e'], ['c', 6], ['d', 2, 'f', null], ['e', 4], ['f', 1],
        ], { a: [260, 38], b: [135, 118], c: [385, 118], d: [70, 205], e: [198, 205], f: [42, 285] }, '0 0 520 340'),
        rightView: standardTree([
          ['a', 1, 'b', 'c'], ['b', 2, null, 'd'], ['c', 3, null, 'e'], ['d', 5], ['e', 4],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [198, 225], e: [448, 225] }),
        prefix: standardTree([
          ['a', 10, 'b', 'c'], ['b', 5, 'd', 'e'], ['c', -3, null, 'f'], ['d', 3, 'g', 'h'], ['e', 2, null, 'i'],
          ['f', 11], ['g', 3], ['h', -2], ['i', 1],
        ], { a: [260, 38], b: [135, 115], c: [385, 115], d: [72, 193], e: [198, 193], f: [448, 193], g: [42, 280], h: [105, 280], i: [230, 280] }, '0 0 520 330'),
        lca: standardTree([
          ['a', 3, 'b', 'c'], ['b', 5, 'd', 'e'], ['c', 1, 'f', 'g'], ['d', 6], ['e', 2, 'h', 'i'], ['f', 0], ['g', 8], ['h', 7], ['i', 4],
        ], { a: [260, 38], b: [135, 115], c: [385, 115], d: [72, 193], e: [198, 193], f: [322, 193], g: [448, 193], h: [165, 280], i: [230, 280] }, '0 0 520 330'),
        maxPath: standardTree([
          ['a', -10, 'b', 'c'], ['b', 9], ['c', 20, 'd', 'e'], ['d', 15], ['e', 7],
        ], { a: [260, 42], b: [135, 132], c: [385, 132], d: [322, 225], e: [448, 225] }),
      };

      function build94() {
        const cfg = layouts.small;
        const steps = [];
        const output = [];
        const stack = [];
        const visited = [];
        pushStep(steps, cfg.tree, '准备开始中序遍历', '顺序是：左子树 → 当前节点 → 右子树。', 1, { stack: [], output: [] });
        function dfs(id) {
          if (!id) {
            pushStep(steps, cfg.tree, '遇到 null，返回', '空子树不产生输出。', 2, { current: stack[stack.length - 1] || null, stack: [...stack], output: [...output], visited: [...visited] });
            return;
          }
          stack.push(id);
          pushStep(steps, cfg.tree, `进入节点 ${val(cfg, id)}`, '先递归处理左子树。', 1, { current: id, stack: [...stack], output: [...output], visited: [...visited] });
          dfs(cfg.tree[id].left);
          visited.push(id);
          output.push(val(cfg, id));
          pushStep(steps, cfg.tree, `访问节点 ${val(cfg, id)}`, `把 ${val(cfg, id)} 加入中序结果。`, 4, { current: id, stack: [...stack], output: [...output], visited: [...visited] });
          dfs(cfg.tree[id].right);
          stack.pop();
          pushStep(steps, cfg.tree, `返回 ${val(cfg, id)}`, '当前节点的左右子树都处理完了。', 5, { current: stack[stack.length - 1] || null, stack: [...stack], output: [...output], visited: [...visited] });
        }
        dfs('a');
        return {

      function build437() {

        pushStep(steps, cfg.tree, `统计完成：共有 ${result} 条路径`, '进入节点时加入前缀和，离开节点时必须撤销。', 8, { current: null, stack: [], path: [], prefix: { ...prefix }, result, target });

      function build236() {

      const builders = { '94': build94, '104': build104, '226': build226, '101': build101, '543': build543, '102': build102, '108': build108, '98': build98, '230': build230, '199': build199, '437': build437, '236': build236, '124': build124 };

      const steps = mode.steps;

      document.title = mode.title;
      document.querySelector('#eyebrow').textContent = mode.eyebrow;

      function render() {

        document.querySelector('#progressBar').style.width = `${total ? (index / total) * 100 : 100}%`;
        document.querySelector('#prev').disabled = index === 0;
        document.querySelector('#next').disabled = index === steps.length - 1;

      function stop() {
        if (timer) window.clearInterval(timer);

        document.querySelector('#play').textContent = '▶ 自动播放';

      function next() {

        index += 1;

        if (event.target.matches('button, input, textarea')) return;
        if (event.key === 'ArrowRight' || event.key === ' ') { event.preventDefault(); next(); }
        if (event.key === 'ArrowLeft') { event.preventDefault(); stop(); index = Math.max(0, index - 1); render(); }
      });

      render();
    </script>
  </body>
</html>
