<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>200 岛屿数量</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: light-dark(#3f4248, #e7e9ed);
      --muted: light-dark(#7a7f88, #aeb4bf);
      --line: light-dark(#e5e7eb, #363b45);
      --soft: light-dark(rgb(0 0 0 / 3%), rgb(255 255 255 / 5%));
      --water: light-dark(#eef2f5, #2c323c);
      --land: light-dark(#cfe2d4, #315541);
      --accent: light-dark(#55799f, #8fb4dd);
      --good: light-dark(#397b55, #9ad2aa);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    html { background: transparent; }
    body {
      margin: 0;
      padding: 8px 3px 18px;
      color: var(--ink);
      background: transparent;
    }
    main {
      max-width: 820px;
      margin: auto;
      padding: 2px 0 12px;
      border-bottom: 1px solid var(--line);
    }
    h2 { margin: 0; font-size: 21px; font-weight: 500; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button {
      min-width: 78px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); background: var(--soft); }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }
    .step { margin-left: auto; align-self: center; color: var(--muted); font-size: 12px; }
    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(38px, 64px));
      justify-content: center;
      gap: 6px;
      margin: 17px auto 12px;
    }
    .cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 18px;
      font-weight: 500;
      transition: background-color 160ms ease, outline-color 160ms ease;
    }
    .cell.land { background: var(--land); }
    .cell.water { background: var(--water); color: var(--muted); }
    .cell.current { outline: 3px solid var(--accent); outline-offset: 1px; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .summary strong { color: var(--ink); font-variant-numeric: tabular-nums; }
    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--ink);
      font-size: 13px;
      text-align: center;
    }
    .code {
      margin: 12px auto 0;
      max-width: 620px;
      padding: 9px 12px;
      border-left: 3px solid var(--accent);
      background: var(--soft);
      color: var(--muted);
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    @media (max-width: 520px) {
      .step { width: 100%; margin-left: 0; }
      .board { grid-template-columns: repeat(5, minmax(34px, 52px)); gap: 4px; }
    }
  </style>
</head>
<body>
<main aria-labelledby="title">
  <h2 id="title">200. 岛屿数量：DFS 淹岛</h2>
  <p class="subtitle">发现一块新的 1 就计数，然后把与它相连的陆地全部标成 0。</p>
  <div class="controls" aria-label="动画控制">
    <button id="prev" type="button">← 上一步</button>
    <button id="play" class="primary" type="button">▶ 播放</button>
    <button id="next" type="button">下一步 →</button>
    <button id="reset" type="button">↺ 重置</button>
    <span id="step" class="step" aria-live="polite"></span>
  </div>
  <div id="board" class="board" role="img" aria-label="岛屿网格"></div>
  <div class="summary">
    <span>岛屿数量：<strong id="count">0</strong></span>
    <span>当前格子：<strong id="current">—</strong></span>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div id="code" class="code"></div>
</main>
<script>
  const initialGrid = [
    ["1", "1", "0", "0", "0"],
    ["1", "1", "0", "1", "0"],
    ["0", "0", "0", "1", "1"]
  ];
  const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function cloneGrid(grid) {
    return grid.map(function(row) { return row.slice(); });
  }

  function buildSteps() {
    const grid = cloneGrid(initialGrid);
    const steps = [];
    let islands = 0;

    function save(message, focus) {
      steps.push({
        grid: cloneGrid(grid),
        islands: islands,
        focus: focus || null,
        message: message
      });
    }

    function visit(r, c) {
      if (r < 0 || r >= grid.length || c < 0
          || c >= grid[0].length || grid[r][c] !== "1") {
        return;
      }

      grid[r][c] = "0";
      save("DFS 访问 (" + r + ", " + c + ")：把这块陆地标记为 0。", [r, c]);

      directions.forEach(function(dir) {
        visit(r + dir[0], c + dir[1]);
      });
    }

    save("从左上角开始扫描，暂时还没有发现岛屿。", null);

    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[0].length; c++) {
        if (grid[r][c] === "1") {
          islands++;
          save("发现一块未访问的陆地，岛屿数量加一。", [r, c]);
          visit(r, c);
        }
      }
    }

    save("扫描完成：所有陆地都被归入某个连通块。", null);
    return steps;
  }

  const steps = buildSteps();
  let index = 0;
  let timer = null;
  const board = document.querySelector("#board");
  const stepText = document.querySelector("#step");
  const countText = document.querySelector("#count");
  const currentText = document.querySelector("#current");
  const statusText = document.querySelector("#status");
  const codeText = document.querySelector("#code");
  const playButton = document.querySelector("#play");

  function render() {
    const state = steps[index];
    board.innerHTML = "";

    state.grid.forEach(function(row, r) {
      row.forEach(function(value, c) {
        const cell = document.createElement("div");
        cell.className = "cell " + (value === "1" ? "land" : "water");
        if (state.focus && state.focus[0] === r && state.focus[1] === c) {
          cell.classList.add("current");
        }
        cell.textContent = value;
        cell.setAttribute("aria-label", "第 " + r + " 行第 " + c + " 列：" + value);
        board.appendChild(cell);
      });
    });

    stepText.textContent = "步骤 " + (index + 1) + " / " + steps.length;
    countText.textContent = state.islands;
    currentText.textContent = state.focus ? "(" + state.focus[0] + ", " + state.focus[1] + ")" : "—";
    statusText.textContent = state.message;
    codeText.textContent = state.focus
      ? "当前动作：grid[r][c] = '0'；继续递归四个方向。"
      : "扫描动作：if (grid[r][c] == '1') islands++;";
    document.querySelector("#prev").disabled = index === 0;
    document.querySelector("#next").disabled = index === steps.length - 1;
  }

  function stop() {
    if (timer !== null) {
      clearInterval(timer);
      timer = null;
    }
    playButton.textContent = "▶ 播放";
  }

  function next() {
    if (index < steps.length - 1) {
      index++;
      render();
    } else {
      stop();
    }
  }

  document.querySelector("#prev").addEventListener("click", function() {
    stop();
    if (index > 0) {
      index--;
      render();
    }
  });
  document.querySelector("#next").addEventListener("click", next);
  document.querySelector("#reset").addEventListener("click", function() {
    stop();
    index = 0;
    render();
  });
  playButton.addEventListener("click", function() {
    if (timer !== null) {
      stop();
      return;
    }
    if (index === steps.length - 1) {
      index = 0;
      render();
    }
    playButton.textContent = "Ⅱ 暂停";
    timer = setInterval(next, 900);
  });

  render();
</script>
</body>
</html>
